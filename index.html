<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christian - Sito Personale</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(135deg, #0a2540 0%, #144e9e 40%, #1e88e5 70%, #90caf9 100%);
    color: #fff;
  }
  .card {
    width: 100%;
    max-width: 600px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 48px 40px;
    box-shadow: 0 20px 60px rgba(0,20,60,0.4);
    text-align: center;
    animation: cardIn 0.9s ease-out both;
  }
  h1 {
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #e3f2fd, #90caf9, #ffffff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: textIn 1.2s ease-out 0.2s both;
  }
  .subtitle {
    margin-top: 8px;
    color: #bbdefb;
    font-size: clamp(1rem, 3vw, 1.2rem);
    animation: textIn 1.2s ease-out 0.4s both;
  }
  ul {
    list-style: none;
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  li {
    background: linear-gradient(90deg, rgba(13,71,161,0.8), rgba(30,136,229,0.8));
    border: 1px solid rgba(144,202,249,0.4);
    padding: 16px 20px;
    border-radius: 12px;
    font-size: clamp(1rem, 3.5vw, 1.15rem);
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
    animation: textIn 1s ease-out both;
  }
  li:nth-child(1) { animation-delay: 0.6s; }
  li:nth-child(2) { animation-delay: 0.8s; }
  li::before {
    content: "•";
    color: #90caf9;
    font-size: 1.8rem;
    line-height: 1;
  }
  @keyframes textIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
  @media (max-width: 480px) {
    .card { padding: 32px 20px; }
    li { flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Christian</h1>
    <p class="subtitle">Sito Personale</p>
    <ul>
      <li>Studente ITS Demos</li>
      <li>Corso Cybersecurity</li>
    </ul>
  </main>
</body>
</html>
