<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acchiappa la Talpa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;700&display=swap">
<style>
  /* Layout: un prato visto dall'alto, tabellone di legno in cima, 9 buche in griglia 3×3.
     Un solo look voluto (il prato di giorno), quindi niente tema scuro. */
  :root {
    color-scheme: light;
    --grass: #7cc35a;
    --grass-dark: #5fa443;
    --soil: #5b3a24;
    --soil-deep: #2e1c10;
    --mole: #8a5a3b;
    --mole-belly: #d9a77f;
    --wood: #f4d18a;
    --ink: #2d1f14;
    --gold: #ffcc33;
    --hit: #e8473a;
    --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  }
  html, body { height: 100%; margin: 0; }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background:
      radial-gradient(circle at 20% 30%, var(--grass-dark) 0 2px, transparent 3px) 0 0 / 34px 34px,
      radial-gradient(circle at 70% 80%, var(--grass-dark) 0 2px, transparent 3px) 0 0 / 46px 46px,
      var(--grass);
    color: var(--ink); font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 28px;
    user-select: none; -webkit-user-select: none;
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }

  h1 {
    font-family: var(--display); font-weight: 400; margin: 0; text-align: center;
    font-size: clamp(2.2rem, 9vw, 3.4rem); line-height: 1; color: var(--wood);
    text-shadow: 0 3px 0 var(--soil), 0 6px 0 var(--soil-deep);
    letter-spacing: 0.01em; text-wrap: balance;
  }

  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    background: var(--wood); border: 4px solid var(--soil); border-radius: 14px;
    padding: 10px 14px; box-shadow: 0 5px 0 var(--soil-deep);
    font-variant-numeric: tabular-nums;
  }
  .stat { display: grid; justify-items: center; }
  .stat span { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; }
  .stat strong { font-family: var(--display); font-weight: 400; font-size: 1.9rem; line-height: 1.1; }
  .stat.low strong { color: var(--hit); }

  .field { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(10px, 4vw, 22px); }
  .hole {
    position: relative; aspect-ratio: 1; max-width: 100%;
    border: 0; padding: 0; background: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .hole:focus-visible { outline: 3px solid var(--wood); outline-offset: 4px; border-radius: 50%; }
  /* il buco nel terreno */
  .hole::before {
    content: ""; position: absolute; left: 6%; right: 6%; bottom: 8%; height: 34%;
    background: radial-gradient(ellipse at 50% 40%, var(--soil-deep) 55%, var(--soil) 56%);
    border-radius: 50%;
  }
  /* finestra che nasconde la talpa sotto terra */
  .pit { position: absolute; left: 14%; right: 14%; top: 0; bottom: 22%; overflow: hidden; }
  .mole {
    position: absolute; left: 0; right: 0; bottom: 0; height: 88%;
    background: var(--mole); border-radius: 50% 50% 18% 18% / 60% 60% 18% 18%;
    transform: translateY(105%); transition: transform 0.12s ease-out;
  }
  .hole.up .mole { transform: translateY(8%); }
  .mole.gold { background: var(--gold); }
  .mole::before { /* pancia */
    content: ""; position: absolute; left: 22%; right: 22%; bottom: 0; height: 40%;
    background: var(--mole-belly); border-radius: 50% 50% 0 0;
  }
  .eye { position: absolute; top: 30%; width: 11%; aspect-ratio: 1; background: var(--ink); border-radius: 50%; }
  .eye.l { left: 30%; } .eye.r { right: 30%; }
  .nose { position: absolute; top: 44%; left: 50%; width: 18%; aspect-ratio: 1.3; transform: translateX(-50%); background: #e77f8c; border-radius: 50%; }
  .hole.bonk .eye { height: 3%; aspect-ratio: auto; top: 33%; border-radius: 2px; }
  .hole.bonk .mole { filter: brightness(0.85); }
  /* bordo di terra davanti alla talpa */
  .lip {
    position: absolute; left: 6%; right: 6%; bottom: 8%; height: 17%;
    background: var(--soil); border-radius: 0 0 50% 50% / 0 0 100% 100%;
    pointer-events: none;
  }

  .pop {
    position: absolute; left: 50%; top: 4%; transform: translateX(-50%);
    font-family: var(--display); font-size: 1.6rem; color: var(--wood);
    text-shadow: 0 2px 0 var(--soil-deep); pointer-events: none;
    animation: rise 0.6s ease-out forwards;
  }
  @keyframes rise { to { transform: translate(-50%, -60%); opacity: 0; } }

  .panel {
    background: var(--wood); border: 4px solid var(--soil); border-radius: 14px;
    box-shadow: 0 5px 0 var(--soil-deep); padding: 14px 18px;
    display: grid; gap: 10px; justify-items: center; text-align: center;
  }
  .panel p { margin: 0; font-size: 1.05rem; line-height: 1.4; max-width: 40ch; }
  .panel .result { font-family: var(--display); font-size: 1.6rem; line-height: 1.1; }
  .start {
    font-family: var(--display); font-size: 1.4rem; color: var(--wood);
    background: var(--hit); border: 0; border-radius: 999px; padding: 10px 30px;
    box-shadow: 0 4px 0 var(--soil-deep); cursor: pointer;
  }
  .start:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--soil-deep); }
  .start:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .mole { transition: none; }
    .pop { animation: none; opacity: 0; }
  }
</style>
</head>
<body>

<main>
  <h1>Acchiappa la Talpa!</h1>

  <div class="board" aria-live="polite">
    <div class="stat"><span>Punti</span><strong id="score">0</strong></div>
    <div class="stat" id="timeBox"><span>Tempo</span><strong id="time">30</strong></div>
    <div class="stat"><span>Record</span><strong id="best">0</strong></div>
  </div>

  <div class="field" id="field"></div>

  <div class="panel" id="panel">
    <p class="result" id="result" hidden></p>
    <p id="msg">Colpisci le talpe prima che si rintanino. Quella dorata vale <b>3 punti</b>. Hai 30 secondi!</p>
    <button class="start" id="start" type="button">Gioca</button>
  </div>
</main>

<script>
(() => {
  const DURATION = 30;
  const field = document.getElementById('field');
  const $ = id => document.getElementById(id);

  const holes = Array.from({ length: 9 }, (_, i) => {
    const b = document.createElement('button');
    b.className = 'hole'; b.type = 'button'; b.setAttribute('aria-label', 'Buca ' + (i + 1));
    b.innerHTML = '<div class="pit"><div class="mole"><span class="eye l"></span><span class="eye r"></span><span class="nose"></span></div></div><div class="lip"></div>';
    field.appendChild(b);
    return b;
  });

  let score = 0, timeLeft = DURATION, playing = false, tick = 0, spawnTimer = 0;
  let best = 0;
  try { best = +localStorage.getItem('talpa-record') || 0; } catch (e) {}
  $('best').textContent = best;

  // Prima schermata: una talpa che saluta, così si capisce subito il gioco
  holes[4].classList.add('up');

  function hideAll() {
    holes.forEach(h => { h.classList.remove('up', 'bonk'); clearTimeout(h._t); });
  }

  function spawn() {
    if (!playing) return;
    const free = holes.filter(h => !h.classList.contains('up'));
    if (free.length) {
      const h = free[Math.floor(Math.random() * free.length)];
      const gold = Math.random() < 0.12;
      h.querySelector('.mole').classList.toggle('gold', gold);
      h.dataset.points = gold ? 3 : 1;
      h.classList.remove('bonk'); h.classList.add('up');
      // più passa il tempo, più le talpe sono veloci
      const progress = 1 - timeLeft / DURATION;
      const stay = (gold ? 650 : 1000) - progress * 450;
      h._t = setTimeout(() => h.classList.remove('up'), stay);
    }
    spawnTimer = setTimeout(spawn, 700 - (1 - timeLeft / DURATION) * 380);
  }

  function whack(h) {
    if (!playing || !h.classList.contains('up') || h.classList.contains('bonk')) return;
    const pts = +h.dataset.points;
    score += pts; $('score').textContent = score;
    h.classList.add('bonk'); clearTimeout(h._t);
    const pop = document.createElement('span');
    pop.className = 'pop'; pop.textContent = '+' + pts;
    h.appendChild(pop); setTimeout(() => pop.remove(), 600);
    setTimeout(() => h.classList.remove('up', 'bonk'), 220);
  }
  holes.forEach(h => h.addEventListener('pointerdown', e => { e.preventDefault(); whack(h); }));
  holes.forEach(h => h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); whack(h); } }));

  function start() {
    score = 0; timeLeft = DURATION; playing = true;
    $('score').textContent = 0; $('time').textContent = DURATION;
    $('timeBox').classList.remove('low');
    $('panel').hidden = true; hideAll();
    tick = setInterval(() => {
      timeLeft--; $('time').textContent = timeLeft;
      $('timeBox').classList.toggle('low', timeLeft <= 5);
      if (timeLeft <= 0) end();
    }, 1000);
    spawn();
  }

  function end() {
    playing = false; clearInterval(tick); clearTimeout(spawnTimer); hideAll();
    const record = score > best;
    if (record) {
      best = score; $('best').textContent = best;
      try { localStorage.setItem('talpa-record', best); } catch (e) {}
    }
    $('result').hidden = false;
    $('result').textContent = record ? `Nuovo record: ${score} punti!` : `${score} punti`;
    $('msg').textContent = score >= 30 ? 'Riflessi da campione. Le talpe sono in sciopero.'
      : score >= 15 ? 'Bel colpo! Riesci a fare di meglio?'
      : 'Le talpe ridono di te. Riprova!';
    $('start').textContent = 'Gioca ancora';
    $('panel').hidden = false;
  }

  $('start').addEventListener('click', start);
})();
</script>
</body>
</html>
